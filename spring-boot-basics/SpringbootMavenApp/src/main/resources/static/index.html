<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spring Boot Greeting App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Spring Boot Greeting App</h1>

    <p class="subtitle">
        Maven + Spring Boot + JavaScript
    </p>

    <div class="card">

        <h2 id="greeting">
            Hello, Guest! 👋
        </h2>

        <div class="input-section">

            <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
            >

            <button onclick="getGreeting()">
                Greet
            </button>

        </div>

        <p id="serverTime">
            Server time: Loading...
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>html>
